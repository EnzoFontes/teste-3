services:
  - type: web
    name: vm-scheduling-app
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node server.js
    disk:
      name: sqlite-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /data/database.sqlite
